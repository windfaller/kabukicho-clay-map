*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f3e6d6;font-family:system-ui,-apple-system,"Noto Sans TC","Hiragino Sans","PingFang TC","Microsoft JhengHei",sans-serif;color:#3a2e2a}

button,select{font:inherit;color:inherit}
#brand{left:14px;top:14px;padding:9px 15px}#brand b{font-size:19px;display:block}#brand small{opacity:.65;font-size:12px}
